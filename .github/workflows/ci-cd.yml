# Flujo de integración y despliegue continuos (CI/CD).
#
# Integración continua (CI): cada cambio que llega al repositorio se verifica
# automáticamente, sin depender de que alguien recuerde correr las pruebas.
# Despliegue continuo (CD): si la verificación pasa, el cambio se publica.
# En este proyecto el despliegue es simulado: solo imprime un mensaje.
#
# En GitHub Actions este archivo es un "workflow". Contiene "jobs" (trabajos que
# corren en una máquina virtual llamada runner) y cada job contiene "steps" (pasos).

name: CI/CD

# Eventos que disparan el workflow: un push a main o un pull request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # CI: análisis estático
  # ---------------------------------------------------------------------------
  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Revisa errores probables, comparaciones peligrosas y complejidad sin ejecutar el código.
      - name: Revisar el código con ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # CI: pruebas unitarias
  # ---------------------------------------------------------------------------
  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en el runner.
      - name: Descargar el código
        uses: actions/checkout@v6

      # Instala Node.js 24 (LTS) y guarda en caché las dependencias de npm
      # para que las siguientes ejecuciones sean más rápidas.
      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci instala exactamente las versiones de package-lock.json.
      # A diferencia de npm install, nunca modifica el lockfile: es lo indicado para CI.
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # CI: pruebas BDD
  # ---------------------------------------------------------------------------
  # Ejecuta los escenarios escritos en Gherkin (tests/bdd/features). Son pruebas
  # funcionales: verifican el comportamiento contra el requisito, con frases que
  # Producción puede leer. Corre en su propia máquina, en paralelo con las pruebas
  # unitarias: un job no ve lo que instaló otro, por eso repite la preparación.
  pruebas-bdd:
    name: Pruebas BDD
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # jest-cucumber ejecuta cada escenario de los .feature como una prueba de Jest,
      # con los pasos definidos en los archivos *.steps.js.
      - name: Ejecutar escenarios BDD
        run: npm run test:bdd

  # ---------------------------------------------------------------------------
  # CI: cobertura de código
  # ---------------------------------------------------------------------------
  # Ejecuta todas las pruebas midiendo la cobertura. Si las líneas o las ramas
  # cubiertas bajan del umbral de jest.config.js (90 %), Jest termina con error
  # y el job falla.
  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:cobertura

  # ---------------------------------------------------------------------------
  # CD: despliegue simulado
  # ---------------------------------------------------------------------------
  despliegue:
    name: Despliegue (simulado)
    # needs: el despliegue solo corre si todos los jobs listados terminaron bien.
    # Si una prueba falla, este job no se ejecuta y nada llega a producción.
    needs: [analisis-estatico, pruebas-unitarias, pruebas-bdd, cobertura]
    # Solo se despliega lo que entra a main, nunca desde un pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        run: |
          echo "Versión: ${{ github.sha }}"
          echo "Desplegado"
